# Release GitHub : à chaque tag vX.Y.Z (posé sur main en fin de branche
# release/, voir CLAUDE.md « Git »), vérifie la version et le CHANGELOG, lance
# les tests, construit l'application macOS universelle (arm64 + x86_64,
# macOS 12+) et publie la release avec le .dmg, l'.app zippée et les sommes SHA-256.
#
# Relancer à la main (Actions → Release → Run workflow) avec un tag existant
# remplace les fichiers et les notes de sa release.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à (re)publier, ex. v0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: macOS universel
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Récupérer le code du tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Vérifier la version et le CHANGELOG
        run: |
          VERSION="${TAG#v}"
          node scripts/version.mjs
          PKG="$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::Le tag $TAG ne correspond pas à la version $PKG (npm run version:set -- $VERSION sur la branche release/)."
            exit 1
          fi
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust (arm64 + x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Dépendances npm
        run: npm ci

      - name: Tests et types
        run: |
          npm test
          npm run check
          cd src-tauri && cargo test

      - name: Build universel
        run: npm run app:build:universal

      - name: Préparer les fichiers
        run: |
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          OUT="$RUNNER_TEMP/out"
          NAME="Kettler-RUN-7_${VERSION}_macOS-universal"
          mkdir -p "$OUT"
          cp "$BUNDLE"/dmg/*.dmg "$OUT/$NAME.dmg"
          ditto -c -k --keepParent "$BUNDLE/macos/Kettler RUN 7.app" "$OUT/$NAME.app.zip"
          (cd "$OUT" && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt)
          ls -l "$OUT"

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/out/* --clobber
            gh release edit "$TAG" --title "Kettler RUN 7 $VERSION" --notes-file "$RUNNER_TEMP/notes.md" $PRE
          else
            gh release create "$TAG" "$RUNNER_TEMP"/out/* \
              --verify-tag \
              --title "Kettler RUN 7 $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              $PRE
          fi
